# Level 1 (Survival) seed vocabulary — Tamil <-> English <-> Hindi.
# Each entry is a "concept": one meaning expressed in all three languages.
# The content compiler expands each concept into per-language `words` rows
# plus pairwise `translations` rows (en<->ta, en<->hi, ta<->hi), matching
# the word -> sense -> translation model in spec section 4.5.
#
# This is a deliberately-scoped, hand-checked starter set (not the full
# 2,000-word MVP target) — see THE-18/THE-19 for the content-scale-up plan.

