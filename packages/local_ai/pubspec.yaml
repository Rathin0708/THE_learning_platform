name: local_ai
description: "Desktop-only local LLM (llama.cpp) backend for Engine B (THE-51..54). Web-safe: the dart:ffi implementation is behind a conditional export, so depending on this package does not break web builds."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../core
  llama_cpp_dart:
    path: ../../native/llama_cpp_dart_patched
  ffi: ^2.1.3
  path: ^1.9.0
  path_provider: ^2.1.5
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: ^3.0.5
